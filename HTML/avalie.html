<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalie um filme | CineIndex</title>
    <script src="../JS/button.js" defer></script>
    <script src="../JS/avaliacoes.js" defer></script>
    <link rel="stylesheet" href="../CSS/avalie.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <table width="100%" border="0">
            <tr>
                <td width="25%">
                    <div class="logo-area">
                        <input type="checkbox" id="menu-toggle" checked>
                        <label for="menu-toggle" class="menu-toggle-label" aria-label="Alternar menu lateral">☰</label>
                        <a href="index.html"><img src="../IMG/logocineindex.png" alt="Logo CineIndex" width="200"></a>
                    </div>
                </td>
                <td align="left" width="50%">
                    <div class="pesquisa">
                        <label class="search-label" aria-label="Pesquisar">
                            <span class="material-symbols-outlined" aria-hidden="true"></span>
                        </label>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchinput" class="searchinput" placeholder="Pesquisar..."
                            aria-label="Pesquisar filmes e conteúdo">
                    </div>
                </td>
                <td width="10%" align="right">
                    <svg class="icone-notificacao" width="30" height="30" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                        <path d="M18 8a6 6 0 0 0-12 0
                            c0 7-3 7-3 9h18
                            c0-2-3-2-3-9"></path>

                        <path d="M13.73 21
                            a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </td>
                <td width="15%" align="center" class="icone-usuario">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">

                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="7" r="4"></circle>

                    </svg>
                </td>
            </tr>
        </table>
    </header>
    <aside class="sidebar">

        <nav class="menu" aria-label="Navegação principal">
            <a href="index.html" class="menu-item"><span>Início</span></a>
            <a href="index.html#filmes" class="menu-item"><span>Filmes</span></a>
            <a href="index.html#series" class="menu-item"><span>Séries</span></a>
            <a href="lista.html" class="menu-item"><span>Minha Lista</span></a>
            <a href="minhas-avaliacoes.html" class="menu-item"><span>Minhas avaliações</span></a>
            <a href="avalie.html" class="menu-item ativo" aria-current="page"><span>Avaliações</span></a>
            <a href="sobre-nos.html" class="menu-item"><span>Sobre nós</span></a>
            <a href="diario.html" class="menu-item"><span>Diário de bordo</span></a>
            <a href="integrantes.html" class="menu-item"><span>Integrantes</span></a>
            <a href="orcamento.html" class="menu-item"><span>Orçamento</span></a>
            <hr>
            <a href="perfil.html" class="menu-item"><span>Perfil</span></a>
            <a href="config.html" class="menu-item"><span>Configurações</span></a>
        </nav>

        <a href="login.html" class="menu-item sair">
            ↪
            <span>Sair</span>
        </a>

    </aside>
    <main class="reviews-page">
        <section class="reviews-heading">
            <p class="catalogo-etiqueta">SUA OPINIÃO CONTA</p>
            <h1>Avalie um filme</h1>
            <p>Escolha uma nota e deixe um comentário. As avaliações ficam salvas neste navegador.</p>
        </section>
        <form id="review-form" class="review-form">
            <label for="review-movie">Filme ou série</label>
            <select id="review-movie" name="movie" required>
                <option value="">Selecione um título</option>
                <option>Cara-de-Barro</option>
                <option>Lupim</option>
                <option>Jogos Vorazes: Amanhecer na Colheita</option>
                <option>VisionQuest</option>
                <option>Homem-Aranha: Um Novo Dia</option>
                <option>Obsessão</option>
                <option>Resident Evil</option>
                <option>A Odisseia</option>
                <option>Clube da Luta</option>
                <option>Interestelar</option>
                <option>Breaking Bad</option>
                <option>Stranger Things</option>
                <option>The Last of Us</option>
                <option>Sobrenatural</option>
                <option>The Office</option>
                <option>Homem-Aranha: Através do Aranhaverso</option>
                <option>Coraline e o Mundo Secreto</option>
                <option>Rango</option>
                <option>Tá Dando Onda</option>
                <option>Solo Leveling</option>
                <option>Invocação do Mal</option>
                <option>Corra!</option>
                <option>Um Lugar Silencioso</option>
                <option>A Hora do Mal</option>
                <option>Pecadores</option>
                <option>Matrix</option>
                <option>Blade Runner 2049</option>
                <option>Perdido em Marte</option>
                <option>Avatar</option>
                <option>De Volta para o Futuro</option>
            </select>

            <label for="review-rating">Nota</label>
            <select id="review-rating" name="rating" required>
                <option value="">Selecione uma nota</option>
                <option value="5">5 — Excelente</option>
                <option value="4">4 — Muito bom</option>
                <option value="3">3 — Bom</option>
                <option value="2">2 — Regular</option>
                <option value="1">1 — Não gostei</option>
            </select>

            <label for="review-comment">Comentário</label>
            <textarea id="review-comment" name="comment" rows="4" maxlength="500"
                placeholder="O que você achou?"></textarea>

            <button type="submit">Salvar avaliação</button>
            <p id="review-status" class="review-status" role="status" aria-live="polite"></p>
        </form>
    </main>
</body>

</html>
